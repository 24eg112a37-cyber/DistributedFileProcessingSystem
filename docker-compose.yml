services:
  postgres:
    image: postgres:16
    container_name: dfps-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: file_processing
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - dfps_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d file_processing"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  dfps_pgdata:
